name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to Render
        run: |
          # Save logs to deploy.log so we can email them if something breaks
          curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK }} 2>&1 | tee deploy.log

      - name: Upload deploy log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-log
          path: deploy.log

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    if: failure() # run only if deploy job failed
    steps:
      - name: Download deploy log
        uses: actions/download-artifact@v4
        with:
          name: deploy-log
          path: .

      - name: Send email on failure
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "Deployment failed: ${{ github.repository }}"
          to: "eventviewzinfo@gmail.com"
          from: "toxicempire3@gmail.com"
          body: |
            Deployment failed for repo: ${{ github.repository }}
            Branch: ${{ github.ref }}
            Workflow: ${{ github.workflow }}
            Run ID: ${{ github.run_id }}

            Please check attached log for details.
          attachments: deploy.log
